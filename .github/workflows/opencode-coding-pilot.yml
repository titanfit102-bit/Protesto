name: OpenCode autonomous coding pilot (artifact only)

on:
  pull_request:
    branches: [feat/protesto-foundation]
    paths:
      - .github/workflows/opencode-coding-pilot.yml

permissions:
  contents: read

concurrency:
  group: protesto-coding-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    if: >-
      github.head_ref == 'experiment/opencode-pilot' &&
      github.event.pull_request.head.repo.full_name == 'titanfit102-bit/Protesto' &&
      github.event.pull_request.user.login == 'titanfit102-bit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protesto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protesto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/protesto
      APP_ORIGIN: http://127.0.0.1:4174
      PROTESTO_RATE_LIMIT_SECRET: synthetic-ci-rate-limit-secret-for-isolated-postgres-only
      PROTESTO_DIALOGUE_SECRET: synthetic-ci-dialogue-secret-for-isolated-postgres-only
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      OPENCODE_AUTO_SHARE: 'false'
      OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"deny","read":{"*":"allow","*.env":"deny","*.env.*":"deny"},"glob":"allow","grep":"allow","list":"allow","edit":{"*":"deny","*test/opencode-validation-extra.test.mjs":"allow"},"external_directory":"deny"}}'
    steps:
      - name: Checkout isolated experimental PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenCode
        run: npm install --global opencode-ai --no-audit --no-fund
      - name: Select free AI model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          opencode models opencode > /tmp/opencode-models.txt
          CHOICE=''
          for candidate in 'opencode/glm-5.3-flash-free' 'opencode/deepseek-v4.1-flash-free'; do
            if grep -Fxq "$candidate" /tmp/opencode-models.txt; then
              CHOICE="$candidate"
              break
            fi
          done
          if [ -z "$CHOICE" ]; then echo 'No designated free model available'; exit 1; fi
          echo "model=$CHOICE" >> "$GITHUB_OUTPUT"
          echo "Selected $CHOICE"
      - name: AI creates ONLY a new validation test file
        shell: bash
        env:
          SELECTED_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          test ! -e test/opencode-validation-extra.test.mjs
          timeout 300s opencode run --agent build --model "$SELECTED_MODEL" \
            'Coding pilot in the PUBLIC Protesto repository. Read AGENTS.md, src/domain.mjs and test/domain.test.mjs. Your ONE authorized change is to CREATE test/opencode-validation-extra.test.mjs, a standard node:test ES module with at least 3 useful additional regression/edge-case tests for exported validation functions (e.g. title min/max limits, malicious source URL credentials, calendar edge cases). Only synthetic data. Do not modify any other file or any production code. Do not run bash, network commands, commits, or deployment; validation is executed by GitHub CI after you finish. Use the write/edit tool to CREATE the file, do not merely describe its contents. Keep imports local and use node:assert/strict. End with a concise Albanian explanation.' \
            2>&1 | tee /tmp/opencode-coding.log
          test -s /tmp/opencode-coding.log
          test -s test/opencode-validation-extra.test.mjs
          # No tracked-file changes and no unexpected added files.
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git ls-files --others --exclude-standard | grep -v '^test/opencode-validation-extra.test.mjs$' || true)"
          if [ -n "$unexpected" ]; then echo "Unexpected new files: $unexpected"; exit 1; fi
          # Guardrails: tests may import Node test/assert and local domain only; no external process, network or file access.
          if grep -Eq 'child_process|process[.]env|node:fs|node:net|node:http|node:https|fetch[(]|eval[(]|Function[(]|\.\./\.\./' test/opencode-validation-extra.test.mjs; then
            echo 'Potentially unsafe code in generated test file'
            exit 1
          fi
          node --check test/opencode-validation-extra.test.mjs
      - name: Verify generated code with existing project tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run db:migrate
          npm run verify
      - name: Capture patch for review — never commit
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/opencode-pilot-result
          cp /tmp/opencode-models.txt /tmp/opencode-pilot-result/ 2>/dev/null || true
          cp /tmp/opencode-coding.log /tmp/opencode-pilot-result/ 2>/dev/null || true
          if [ -f test/opencode-validation-extra.test.mjs ]; then
            cp test/opencode-validation-extra.test.mjs /tmp/opencode-pilot-result/
            git diff --no-index -- /dev/null test/opencode-validation-extra.test.mjs > /tmp/opencode-pilot-result/generated.patch || test "$?" -eq 1
          fi
      - name: Upload proposed change for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-generated-test-proposal
          path: /tmp/opencode-pilot-result/
          retention-days: 7
          if-no-files-found: warn
