name: OpenCode - verify automatic draft PR permission

on:
  pull_request:
    branches:
      - feat/protesto-foundation
    paths:
      - .github/workflows/opencode-pr-permission-check.yml

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.head_ref == 'experiment/opencode-pilot' &&
      github.event.pull_request.head.repo.full_name == 'titanfit102-bit/Protesto' &&
      github.event.pull_request.user.login == 'titanfit102-bit' &&
      github.actor == 'titanfit102-bit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify GitHub Actions can open one draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const repo = "titanfit102-bit/Protesto";
          const base = "feat/protesto-foundation";
          const branch = "opencode/pilot-pr-permission-check";
          const api = "https://api.github.com/repos/" + repo;
          const token = process.env.GH_TOKEN;
          if (!token) throw new Error("GitHub token missing");
          async function call(method, path, body, allow404 = false) {
            const r = await fetch(api + path, {
              method,
              headers: {
                Authorization: "Bearer " + token,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                ...(body ? {"Content-Type": "application/json"} : {})
              },
              body: body ? JSON.stringify(body) : undefined
            });
            const raw = await r.text();
            if (allow404 && r.status === 404) return null;
            if (!r.ok) throw new Error(method + " " + path + ": HTTP " + r.status + " " + raw.slice(0, 500));
            return JSON.parse(raw);
          }
          const baseData = await call("GET", "/git/ref/heads/" + base);
          const baseSha = baseData.object.sha;
          let ref = await call("GET", "/git/ref/heads/" + branch, null, true);
          const list = await call("GET", "/pulls?state=open&head=titanfit102-bit%3A" + encodeURIComponent(branch) + "&base=" + encodeURIComponent(base));
          if (list.length) {
            console.log("Draft PR already exists: " + list[0].html_url);
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Existing PR: " + list[0].html_url + "\n");
            process.exit(0);
          }
          if (!ref) {
            ref = await call("POST", "/git/refs", { ref: "refs/heads/" + branch, sha: baseSha });
            await call("PUT", "/contents/docs/OPENCODE_AUTOMATIC_PR_PROOF.md", {
              message: "test(opencode): GitHub Actions draft PR creation permission proof",
              branch,
              content: Buffer.from("# OpenCode PR permission smoke test\n\nThis is a harmless GitHub Actions permission check. No AI-generated code, application logic, production data, or deployment. This branch is not for merging.\n").toString("base64")
            });
          }
          const pr = await call("POST", "/pulls", {
            title: "test(opencode): GitHub Actions automatic draft PR permission",
            head: branch,
            base,
            draft: true,
            body: "## Test only\nThis PR was created by GitHub Actions with its own scoped GITHUB_TOKEN, **not** by ChatGPT. It verifies that automated Draft PR creation is now enabled. No application code or secrets were modified. **Do not merge.**"
          });
          console.log("AUTOMATIC DRAFT PR CREATED: " + pr.html_url);
          if (!pr.draft || pr.base.ref !== base) throw new Error("Unexpected PR state");
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Verified automatic draft PR: " + pr.html_url + "\n");
          NODE
