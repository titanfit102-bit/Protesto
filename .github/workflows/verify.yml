name: Protesto MVP checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/protesto-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
