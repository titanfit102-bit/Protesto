name: Protesto verification
on:
  pull_request:
    branches: [main, 'feat/protesto-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protesto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protesto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/protesto
      APP_ORIGIN: http://127.0.0.1:4174
      PROTESTO_RATE_LIMIT_SECRET: synthetic-ci-rate-limit-secret-for-isolated-postgres-only
      PROTESTO_DIALOGUE_SECRET: synthetic-ci-dialogue-secret-for-isolated-postgres-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
      - name: Audit runtime and development dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Syntax-check every JavaScript module
        run: find src tools test -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
      - run: npm run db:migrate
      - name: Confirm migrations are idempotent
        run: npm run db:migrate
      - name: Enforce isolated staging rehearsal boundaries
        env:
          PROTESTO_STAGING_REHEARSAL: '1'
          PROTESTO_BACKUP_TEST: '1'
        run: node tools/staging-gate.mjs
      - run: npm run verify
      - name: Review integrated candidate manifest and fail-closed release gate
        run: node tools/release-audit.mjs
      - name: Install exact Chrome for Testing from lockfile-resolved Puppeteer CLI
        shell: bash
        env:
          CHROME_VERSION: '156.0.8078.47'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protesto-chrome"
          ./node_modules/.bin/browsers install "chrome@$CHROME_VERSION" --path "$RUNNER_TEMP/protesto-chrome"
          CHROME_PATH="$(CHROME_CACHE_DIR="$RUNNER_TEMP/protesto-chrome" node --input-type=module -e 'import {computeExecutablePath, Browser} from "@puppeteer/browsers"; console.log(computeExecutablePath({cacheDir:process.env.CHROME_CACHE_DIR,browser:Browser.CHROME,buildId:process.env.CHROME_VERSION}));')"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
      - name: Verify exact toolchain versions before browser and backup tests
        run: node tools/check-ci-toolchain.mjs
      - name: Build private offline HTML preview (no deployment)
        run: node tools/build-offline-preview.mjs
      - name: Capture real browser demo screenshots
        run: node tools/preview-demo-screenshots.mjs
      - name: Chromium end-to-end journey and accessibility smoke
        env:
          PROTESTO_CAPTURE_PREVIEW: '1'
        run: npm run test:e2e
      - name: Upload offline preview and screenshots as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Protesto-Preview-Offline
          path: dist-preview/
          retention-days: 14
          if-no-files-found: error
      - name: Verify PostgreSQL client tools are available
        run: |
          command -v pg_dump
          command -v pg_restore
      - name: Encrypted backup and isolated restore drill
        env:
          PROTESTO_BACKUP_TEST: '1'
        run: npm run test:backup
