name: Protesto verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/protesto-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protesto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protesto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/protesto
      APP_ORIGIN: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run verify
